AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Sprints 1-2-3 - VPC, sous-reseaux sur deux zones, routage (IGW, NAT optionnelle),
  NACL et VPC Flow Logs chiffres KMS. Portail Groupe Leman Finance SA (equipe bkay).

Parameters:
  Environnement:
    Type: String
    AllowedValues: [dev, prod]
  Equipe:
    Type: String
    Default: bkay
  CidrVpc:
    Type: String
    AllowedPattern: '^10\.[0-9]{1,3}\.0\.0/16$'
    Description: 10.0.0.0/16 (prod) ou 10.1.0.0/16 (dev) - plages sans chevauchement
  ActiverNat:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: NAT Gateway facturee a l'heure - activee seulement pendant les sessions de travail
  RetentionJours:
    Type: Number
    Default: 7

Conditions:
  AvecNat: !Equals [!Ref ActiverNat, "true"]

Resources:
  # ---------- Chiffrement des journaux (nLPD) ----------
  CleJournaux:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Chiffrement des journaux leman-${Environnement}-${Equipe}"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AdministrationParLeCompte
            Effect: Allow
            Principal: {AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"}
            Action: "kms:*"
            Resource: "*"
          - Sid: CloudWatchLogs
            Effect: Allow
            Principal: {Service: !Sub "logs.${AWS::Region}.amazonaws.com"}
            Action: [kms:Encrypt*, kms:Decrypt*, kms:ReEncrypt*, kms:GenerateDataKey*, kms:Describe*]
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"
      Tags:
        - {Key: Name, Value: !Sub "kms-journaux-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  AliasCleJournaux:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/leman-${Environnement}-${Equipe}-journaux"
      TargetKeyId: !Ref CleJournaux

  # ---------- VPC ----------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref CidrVpc
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - {Key: Name, Value: !Sub "vpc-${Environnement}-leman-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  Igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - {Key: Name, Value: !Sub "igw-${Environnement}-leman-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  IgwAttachement:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Igw

  # Plan d'adressage : x.1 public-1a, x.2 prive-1a, x.3 prive-1b, x.4.0/28 fw-1a, x.5 public-1b
  SubPublic1a:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [1, !Cidr [!Ref CidrVpc, 8, 8]]
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: !Sub "sub-public-1a-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  SubPublic1b:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [5, !Cidr [!Ref CidrVpc, 8, 8]]
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: !Sub "sub-public-1b-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  SubPrive1a:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [2, !Cidr [!Ref CidrVpc, 8, 8]]
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - {Key: Name, Value: !Sub "sub-prive-1a-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  SubPrive1b:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [3, !Cidr [!Ref CidrVpc, 8, 8]]
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - {Key: Name, Value: !Sub "sub-prive-1b-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  SubFw1a:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [64, !Cidr [!Ref CidrVpc, 65, 4]]
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - {Key: Name, Value: !Sub "sub-fw-1a-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  # ---------- Routage (sprint 2) ----------
  RtPublique:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {Key: Name, Value: !Sub "rt-public-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  RoutePubliqueInternet:
    Type: AWS::EC2::Route
    DependsOn: IgwAttachement
    Properties:
      RouteTableId: !Ref RtPublique
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw

  AssocPublic1a:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref SubPublic1a, RouteTableId: !Ref RtPublique}

  AssocPublic1b:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref SubPublic1b, RouteTableId: !Ref RtPublique}

  AssocFw1a:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref SubFw1a, RouteTableId: !Ref RtPublique}

  RtPrivee:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {Key: Name, Value: !Sub "rt-prive-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  AssocPrive1a:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref SubPrive1a, RouteTableId: !Ref RtPrivee}

  AssocPrive1b:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref SubPrive1b, RouteTableId: !Ref RtPrivee}

  EipNat:
    Type: AWS::EC2::EIP
    Condition: AvecNat
    DependsOn: IgwAttachement
    Properties:
      Domain: vpc
      Tags:
        - {Key: Name, Value: !Sub "eip-nat-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  Nat:
    Type: AWS::EC2::NatGateway
    Condition: AvecNat
    Properties:
      AllocationId: !GetAtt EipNat.AllocationId
      SubnetId: !Ref SubPublic1a
      Tags:
        - {Key: Name, Value: !Sub "nat-${Environnement}-leman-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  # La route par defaut privee pointe vers la NAT, jamais vers l'IGW (controle cfn-guard)
  RoutePriveeNat:
    Type: AWS::EC2::Route
    Condition: AvecNat
    Properties:
      RouteTableId: !Ref RtPrivee
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref Nat

  # Points de terminaison : acces SSM et S3 sans Internet depuis le prive
  PointS3:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref RtPrivee, !Ref RtPublique]

  # ---------- NACL (sprint 3) ----------
  NaclPublique:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {Key: Name, Value: !Sub "nacl-public-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  NaclPubEntree443:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref NaclPublique, RuleNumber: 100, Protocol: 6, RuleAction: allow, CidrBlock: 0.0.0.0/0, PortRange: {From: 443, To: 443}}
  NaclPubEntree80:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref NaclPublique, RuleNumber: 105, Protocol: 6, RuleAction: allow, CidrBlock: 0.0.0.0/0, PortRange: {From: 80, To: 80}}
  NaclPubEntreeVpc:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref NaclPublique, RuleNumber: 110, Protocol: -1, RuleAction: allow, CidrBlock: 10.0.0.0/8}
  NaclPubEntreeEphemeres:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref NaclPublique, RuleNumber: 120, Protocol: 6, RuleAction: allow, CidrBlock: 0.0.0.0/0, PortRange: {From: 1024, To: 65535}}
  NaclPubSortie:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref NaclPublique, RuleNumber: 100, Protocol: -1, Egress: true, RuleAction: allow, CidrBlock: 0.0.0.0/0}

  NaclPubAssoc1a:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {SubnetId: !Ref SubPublic1a, NetworkAclId: !Ref NaclPublique}
  NaclPubAssoc1b:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {SubnetId: !Ref SubPublic1b, NetworkAclId: !Ref NaclPublique}

  NaclPrivee:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {Key: Name, Value: !Sub "nacl-prive-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  NaclPrivEntreeVpc:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref NaclPrivee, RuleNumber: 100, Protocol: -1, RuleAction: allow, CidrBlock: 10.0.0.0/8}
  NaclPrivEntreeEphemeres:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref NaclPrivee, RuleNumber: 110, Protocol: 6, RuleAction: allow, CidrBlock: 0.0.0.0/0, PortRange: {From: 1024, To: 65535}}
  NaclPrivSortie:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref NaclPrivee, RuleNumber: 100, Protocol: -1, Egress: true, RuleAction: allow, CidrBlock: 0.0.0.0/0}

  NaclPrivAssoc1a:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {SubnetId: !Ref SubPrive1a, NetworkAclId: !Ref NaclPrivee}
  NaclPrivAssoc1b:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {SubnetId: !Ref SubPrive1b, NetworkAclId: !Ref NaclPrivee}

  # ---------- VPC Flow Logs (sprint 12) ----------
  GroupeFlux:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/leman-${Equipe}/${Environnement}/vpc-flow"
      RetentionInDays: !Ref RetentionJours
      KmsKeyId: !GetAtt CleJournaux.Arn
      Tags:
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  RoleFlux:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: vpc-flow-logs.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}
      Policies:
        - PolicyName: ecriture-flux
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !Sub "${GroupeFlux.Arn}:*"
      Tags:
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  JournalFlux:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceType: VPC
      ResourceId: !Ref Vpc
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref GroupeFlux
      DeliverLogsPermissionArn: !GetAtt RoleFlux.Arn
      MaxAggregationInterval: 60
      Tags:
        - {Key: Name, Value: !Sub "fl-vpc-${Environnement}-leman-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

Outputs:
  VpcId:
    Value: !Ref Vpc
  CidrVpc:
    Value: !Ref CidrVpc
  SubPublic1a:
    Value: !Ref SubPublic1a
  SubPublic1b:
    Value: !Ref SubPublic1b
  SubPrive1a:
    Value: !Ref SubPrive1a
  SubPrive1b:
    Value: !Ref SubPrive1b
  SubFw1a:
    Value: !Ref SubFw1a
  RtPrivee:
    Value: !Ref RtPrivee
  RtPublique:
    Value: !Ref RtPublique
  CleJournauxArn:
    Value: !GetAtt CleJournaux.Arn
