AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Sprint 9 - ALB du portail : ecouteur HTTPS 443 (TLS 1.2 minimum), tg-web, tg-app,
  regle /api/* priorite 10, health checks, journaux d'acces dans un bucket chiffre.

Parameters:
  Environnement:
    Type: String
    AllowedValues: [dev, prod]
  Equipe:
    Type: String
    Default: bkay
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubPublic1a:
    Type: AWS::EC2::Subnet::Id
  SubPublic1b:
    Type: AWS::EC2::Subnet::Id
  SgAlb:
    Type: AWS::EC2::SecurityGroup::Id
  WebInstanceId:
    Type: String
  AppInstanceId:
    Type: String
  CertificatAlbArn:
    Type: String
    Description: Certificat ACM de la region (importe, domaine fictif - voir ADR-005)

Resources:
  BucketJournauxAlb:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub "leman-alb-logs-${Environnement}-${Equipe}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - {Id: expiration-30j, Status: Enabled, ExpirationInDays: 30, NoncurrentVersionExpiration: {NoncurrentDays: 7}}
      Tags:
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  PolitiqueBucketJournauxAlb:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketJournauxAlb
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: LivraisonJournauxElb
            Effect: Allow
            Principal: {Service: logdelivery.elasticloadbalancing.amazonaws.com}
            Action: s3:PutObject
            Resource: !Sub "${BucketJournauxAlb.Arn}/alb/AWSLogs/${AWS::AccountId}/*"
          - Sid: TlsObligatoire
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt BucketJournauxAlb.Arn, !Sub "${BucketJournauxAlb.Arn}/*"]
            Condition: {Bool: {aws:SecureTransport: "false"}}

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: PolitiqueBucketJournauxAlb
    Properties:
      Name: !Sub "alb-${Environnement}-leman-${Equipe}"
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref SubPublic1a, !Ref SubPublic1b]
      SecurityGroups: [!Ref SgAlb]
      LoadBalancerAttributes:
        - {Key: access_logs.s3.enabled, Value: "true"}
        - {Key: access_logs.s3.bucket, Value: !Ref BucketJournauxAlb}
        - {Key: access_logs.s3.prefix, Value: alb}
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: "true"}
        - {Key: deletion_protection.enabled, Value: "false"}
      Tags:
        - {Key: Name, Value: !Sub "alb-${Environnement}-leman-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  TgWeb:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "tg-web-${Environnement}-${Equipe}"
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: "30"}
      Targets: [{Id: !Ref WebInstanceId, Port: 80}]
      Tags:
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  TgApp:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "tg-app-${Environnement}-${Equipe}"
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8080
      TargetType: instance
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: "30"}
      Targets: [{Id: !Ref AppInstanceId, Port: 8080}]
      Tags:
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  EcouteurHttps:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref CertificatAlbArn}]
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref TgWeb}]

  RegleApi:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref EcouteurHttps
      Priority: 10
      Conditions: [{Field: path-pattern, Values: ["/api/*"]}]
      Actions: [{Type: forward, TargetGroupArn: !Ref TgApp}]

Outputs:
  AlbDns:
    Value: !GetAtt Alb.DNSName
  AlbZoneId:
    Value: !GetAtt Alb.CanonicalHostedZoneID
  AlbArn:
    Value: !Ref Alb
  AlbDimension:
    Value: !GetAtt Alb.LoadBalancerFullName
  TgWebDimension:
    Value: !GetAtt TgWeb.TargetGroupFullName
