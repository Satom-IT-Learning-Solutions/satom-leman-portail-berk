name: pipeline-devsecops

# Sept etapes (section 2.1 de l'enonce). Authentification AWS par OIDC uniquement :
# aucune cle d'acces longue duree, aucun secret AWS dans le depot.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  ROLE_DEPLOIEMENT: arn:aws:iam::223310160799:role/leman-github-deploy-bkay

jobs:
  # ---------------------------------------------------------------- 1. Qualite
  qualite:
    name: 1 - Qualite de code
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - name: Outils
        run: pip install --only-binary ':all:' --require-hashes -r requirements-dev.txt
      - name: cfn-lint (templates)
        run: |
          cfn-lint
      - name: ruff (lint et format)
        run: ruff check app scripts && ruff format --check app scripts
      - name: shellcheck (scripts Bash)
        run: shellcheck -x scripts/*.sh tests/connectivity/*.sh tests/mesures/*.sh
      - name: Tests unitaires et couverture
        run: python -m pytest --cov --cov-report=xml:coverage.xml --cov-report=term
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: couverture, path: coverage.xml}
      - name: Analyse SonarQube Cloud et quality gate
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        with:
          args: -Dsonar.qualitygate.wait=true

  # ------------------------------------------------------- 2. Securite statique
  securite-statique:
    name: 2 - Securite statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - name: Outils de securite (versions verrouillees)
        run: pip install --only-binary ':all:' --require-hashes --no-deps -r requirements-securite.txt
      - name: cfn-guard (regles du portail)
        run: |
          curl --proto '=https' --tlsv1.2 -sSL -o guard.tgz https://github.com/aws-cloudformation/cloudformation-guard/releases/download/3.1.2/cfn-guard-v3-x86_64-ubuntu-latest.tar.gz
          tar xzf guard.tgz && GUARD=cfn-guard-v3-x86_64-ubuntu-latest/cfn-guard
          $GUARD validate -d templates/ -d bootstrap/ -r policies/guard/portail.guard --show-summary fail
          # Test de non-regression : un SG avec SSH ouvert au monde DOIT etre refuse
          if $GUARD validate -d tests/guard/sg-ssh-ouvert.yaml -r policies/guard/portail.guard --show-summary none; then
            echo "La regle ports_admin_fermes n'a pas bloque le cas negatif"; exit 1; fi
          echo "Cas negatif correctement refuse"
      - name: checkov (IaC et workflows)
        run: |
          checkov -d . --config-file policies/checkov/.checkov.yaml
      - name: Semgrep (SAST)
        run: |
          semgrep scan --config p/python --config p/secrets --severity ERROR --error app scripts
      - name: gitleaks (secrets, tout l'historique)
        run: |
          curl --proto '=https' --tlsv1.2 -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
      - name: pip-audit (dependances, SCA)
        run: |
          pip-audit -r requirements-dev.txt --no-deps --disable-pip --strict --desc
      - name: pip-audit des outils CI (informatif, suivi ADR-016)
        continue-on-error: true
        run: pip-audit -r requirements-securite.txt --no-deps --disable-pip --desc
      - name: Controle des CIDR (sprint 5)
        run: python scripts/verifier_cidr.py parameters

  # -------------------------------------------------------- 3. SBOM
  construction-sbom:
    name: 3 - Construction et SBOM
    runs-on: ubuntu-latest
    needs: [qualite, securite-statique]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: SBOM CycloneDX (Syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom/sbom-${{ github.sha }}.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: sbom, path: sbom/}

  # -------------------------------------------------------- 4. Deploiement dev
  deploiement-dev:
    name: 4 - Deploiement dev (change set)
    runs-on: ubuntu-latest
    needs: construction-sbom
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.ROLE_DEPLOIEMENT }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Change set stack-leman-dev
        run: scripts/deployer.sh dev --auto

  # ------------------------------------------- 5. Tests dynamiques et performance
  tests-dynamiques:
    name: 5 - Tests dynamiques, DAST et charge
    runs-on: ubuntu-latest
    needs: deploiement-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.ROLE_DEPLOIEMENT }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Connectivite (cibles ALB saines)
        run: tests/connectivity/cibles_saines.sh stack-leman-dev
      - name: Cible du test (point d'entree public)
        id: cible
        run: echo "url=$(tests/connectivity/url_publique.sh dev)" >> "$GITHUB_OUTPUT"
      - name: Installation de k6
        if: steps.cible.outputs.url != ''
        uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1
      - name: Charge k6 et verification des SLO
        if: steps.cible.outputs.url != ''
        uses: grafana/run-k6-action@54385d2a25c222a08b4a3aec6b653b8fb370a1ed # v1
        env:
          CIBLE: ${{ steps.cible.outputs.url }}
        with:
          path: tests/load/charge.js
      - name: OWASP ZAP baseline (DAST)
        if: steps.cible.outputs.url != ''
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: ${{ steps.cible.outputs.url }}
          rules_file_name: tests/dast/zap-regles.tsv
          fail_action: false
          allow_issue_writing: false
          artifact_name: rapport-zap
      - name: Seuil DAST (0 alerte high)
        if: steps.cible.outputs.url != ''
        run: |
          HIGH=$(jq '[.site[].alerts[] | select(.riskcode == "3")] | length' report_json.json)
          jq -r '.site[].alerts[] | [.riskdesc, .name, .count] | @tsv' report_json.json | sort | uniq
          echo "Alertes high : ${HIGH}"
          test "$HIGH" -eq 0
      - name: Rapports de tests dynamiques
        if: always() && steps.cible.outputs.url != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rapports-tests-dynamiques
          path: |
            docs/rapports/k6-resume.json
            report_json.json
            report_html.html

  # ------------------------------------------ 6. Validation manuelle puis prod
  deploiement-prod:
    name: 6 - Validation manuelle et deploiement prod
    runs-on: ubuntu-latest
    needs: tests-dynamiques
    if: github.ref == 'refs/heads/main'
    environment: prod   # relecteur obligatoire configure sur l'environnement GitHub
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.ROLE_DEPLOIEMENT }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Change set stack-leman-prod
        run: scripts/deployer.sh prod --auto

  # --------------------------------------------------- 7. Post-deploiement
  post-deploiement:
    name: 7 - Post-deploiement (alarmes, conformite)
    runs-on: ubuntu-latest
    needs: deploiement-prod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.ROLE_DEPLOIEMENT }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Alarmes et conformite
        run: tests/connectivity/post_deploiement.sh prod
