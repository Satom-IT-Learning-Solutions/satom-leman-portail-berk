name: connectivite-session

# Sprints 4 a 7 : composants factures a l'heure (NAT + Network Firewall, peering, TGW, VPN),
# crees au debut d'une session de travail puis supprimes. Declenchement manuel uniquement.
on:
  workflow_dispatch:
    inputs:
      pile:
        description: Pile de connectivite
        type: choice
        options: [firewall, peering, tgw, vpn, dxgw]
      action:
        description: Creer/mettre a jour ou supprimer
        type: choice
        options: [deployer, supprimer]

permissions:
  contents: read

concurrency:
  group: connectivite
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  ROLE_DEPLOIEMENT: arn:aws:iam::223310160799:role/leman-github-deploy-bkay

jobs:
  session:
    name: ${{ inputs.action }} ${{ inputs.pile }}
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.ROLE_DEPLOIEMENT }}
          aws-region: ${{ env.AWS_REGION }}
      - name: ${{ inputs.action }} stack-leman-${{ inputs.pile }}
        run: scripts/connectivite.sh "${{ inputs.pile }}" "${{ inputs.action }}"
