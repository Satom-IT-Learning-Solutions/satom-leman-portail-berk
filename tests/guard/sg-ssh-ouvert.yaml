# Cas negatif volontaire : doit etre REFUSE par policies/guard/portail.guard (non deploye)
AWSTemplateFormatVersion: "2010-09-09"
Resources:
  SgInterdit:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH ouvert au monde - interdit
      VpcId: vpc-00000000
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: 0.0.0.0/0}
