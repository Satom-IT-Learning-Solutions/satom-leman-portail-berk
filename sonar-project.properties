sonar.organization=leman-berk
sonar.projectKey=leman-berk_satom-leman-portail-berk
sonar.projectName=satom-leman-portail-berk
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=app/tests/**,tests/**
# Cas negatif volontairement vulnerable (test de non-regression cfn-guard)
sonar.exclusions=tests/guard/**

# Exceptions acceptees et justifiees : voir docs/adr/ADR-016-exceptions-sonarqube.md
sonar.issue.ignore.multicriteria=iam,ec2ip,httpalb,httpapp,logs,sns
# Permissions IAM a Resource "*" : actions Describe/List et services sans ARN de ressource, bornees par region
sonar.issue.ignore.multicriteria.iam.ruleKey=cloudformation:S6304
sonar.issue.ignore.multicriteria.iam.resourceKey=bootstrap/00-bootstrap.yaml
# Instances en sous-reseaux prives (MapPublicIpOnLaunch=false) ; ajouter NetworkInterfaces remplacerait les instances
sonar.issue.ignore.multicriteria.ec2ip.ruleKey=cloudformation:S6329
sonar.issue.ignore.multicriteria.ec2ip.resourceKey=templates/03-calcul.yaml
# Ecouteur HTTP 80 d'origine, joignable uniquement depuis la prefix list CloudFront (HTTPS impose au visiteur)
sonar.issue.ignore.multicriteria.httpalb.ruleKey=cloudformation:S5332
sonar.issue.ignore.multicriteria.httpalb.resourceKey=templates/04-alb.yaml
sonar.issue.ignore.multicriteria.httpapp.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.httpapp.resourceKey=app/portail.py
# Journaux d'acces S3/CloudFront/WAF non actives (cout) : ALB logs + Flow Logs + metriques WAF couvrent le besoin
sonar.issue.ignore.multicriteria.logs.ruleKey=cloudformation:S6258
sonar.issue.ignore.multicriteria.logs.resourceKey=**/*.yaml
# SNS sans CMK : CloudWatch Alarms ne peut pas publier vers une cle geree AWS ; aucune donnee sensible dans les alertes
sonar.issue.ignore.multicriteria.sns.ruleKey=cloudformation:S6327
sonar.issue.ignore.multicriteria.sns.resourceKey=templates/05-supervision.yaml
